# Relaxed until the M1 release (#5): updates once a month, one grouped PR per
# kind. GitHub's security alerts still arrive at once. A release is proposed
# only once it is a week old (cooldown), so a bad one has time to be pulled.
version: 2
updates:
  # The uv workspace (one lock file) and the acceptance suite's own project.
  - package-ecosystem: uv
    directories: ["/", "/acceptance-tests"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The Dockerfile's base images, pinned by tag and digest: the digests move,
  # Python itself stays on 3.14 (ADR 0001).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]

  # compose.yaml: the development database's image; deploy/compose.yaml: the
  # standard setup's proxy.
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
