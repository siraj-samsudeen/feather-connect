# The standard setup of Feather Connect on one machine: the database upgrade (migrate, runs
# once and must finish first), the product (server) and Caddy, which serves the site over
# https with certificates it gets and renews, and sends plain http on to https.
#
# Postgres is not part of this setup: the administrator runs it, makes the database and its
# two users once (docs/deploy.md), and keeps its backups.
#
# Start it, from the checkout's root:
#
#   docker compose -f deploy/compose.yaml up -d --build
#
# The settings are in deploy/.env: copy deploy/.env.example to deploy/.env and fill it in.
# deploy/.env holds passwords: it is never put in git.

name: fcon

services:
  migrate:
    build:
      context: ..
    image: fcon:local
    command: ["db", "upgrade"]
    environment:
      FCON_MIGRATION_DATABASE_URL: ${FCON_MIGRATION_DATABASE_URL:?set FCON_MIGRATION_DATABASE_URL in deploy/.env, the owner user's database address (see deploy/.env.example)}
      FCON_DATABASE_URL: ${FCON_DATABASE_URL:?set FCON_DATABASE_URL in deploy/.env, the app user's database address (see deploy/.env.example)}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  server:
    build:
      context: ..
    image: fcon:local
    command: ["server"]
    environment:
      FCON_DATABASE_URL: ${FCON_DATABASE_URL:?set FCON_DATABASE_URL in deploy/.env, the app user's database address (see deploy/.env.example)}
      FCON_SECRET_KEY: ${FCON_SECRET_KEY:?set FCON_SECRET_KEY in deploy/.env, at least 32 random characters (see deploy/.env.example)}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:2
    environment:
      FCON_DOMAIN: ${FCON_DOMAIN:?set FCON_DOMAIN in deploy/.env, the site's name, such as connect.example.com (see deploy/.env.example)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
