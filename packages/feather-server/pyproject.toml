[project]
name = "feather-server"
version = "0.0.0"
description = "Feather Connect's server: the dashboard's pages, health and readiness."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["fastapi", "starlette", "psycopg[binary]"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.deptry]
# Run from this directory: uv run --directory packages/feather-server deptry .
known_first_party = ["feather_server"]
extend_exclude = ["tests"]
