[project]
name = "fcon-sdk"
version = "0.0.0"
description = "Feather Connect's flow library: flows that move data from one source to many destinations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.deptry]
# Run from this directory: uv run --directory packages/fcon-sdk deptry .
known_first_party = ["fcon_sdk"]
extend_exclude = ["tests"]
