[project]
name = "fcon-cli"
version = "0.0.0"
description = "Feather Connect's command line: the fcon command."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fcon-server",
    "psycopg>=3.3.9",
    "uvicorn",
]

[project.scripts]
fcon = "fcon_cli.main:entry"

[tool.uv.sources]
fcon-server = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.deptry]
# Run from this directory: uv run --directory packages/fcon-cli deptry .
known_first_party = ["fcon_cli"]
extend_exclude = ["tests"]

[tool.mutmut]
# The weekly mutation report (.github/workflows/mutation.yml), run from this
# directory on Linux: uv run --with mutmut mutmut run. mutmut does not run on
# Windows. The repo root's pytest settings apply, without its coverage options.
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-o", "addopts=--import-mode=importlib --strict-markers --strict-config"]
