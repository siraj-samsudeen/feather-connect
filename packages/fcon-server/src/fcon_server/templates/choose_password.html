{% extends "base.html" %}
{% block content %}
<p class="product">{{ view.product }}</p>
<h1>{{ view.heading }}</h1>
<p class="lead">{{ view.lead }}</p>
{% for alert in view.alerts %}
<p class="alert" role="alert" id="{{ alert.id }}">{{ alert.text }}</p>
{% endfor %}
<form{{ view.form | xmlattr }}>
{{ csrf_field() }}
<label for="{{ view.new_field.id }}">New password</label>
<input{{ view.new_field | xmlattr }}>
<p class="hint" id="{{ view.hint_id }}">{{ view.hint }}</p>
<label for="{{ view.again_field.id }}">The same again</label>
<input{{ view.again_field | xmlattr }}>
<button type="submit">Save password</button>
</form>
{% endblock %}
