[project]
name = "fcon-server"
version = "0.0.0"
description = "Feather Connect's server: the dashboard's pages, health and readiness."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "starlette",
    "psycopg[binary]",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "psycopg-pool>=3.3.3",
    "argon2-cffi>=25.1.0",
    "markupsafe>=3.0.4",
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.deptry]
# Run from this directory: uv run --directory packages/fcon-server deptry .
known_first_party = ["fcon_server"]
extend_exclude = ["tests"]

[tool.deptry.per_rule_ignores]
# FastAPI reads form bodies with it; our code never imports it.
DEP002 = ["python-multipart"]

[tool.mutmut]
# The weekly mutation report (.github/workflows/mutation.yml), run from this
# directory on Linux: uv run --with mutmut mutmut run. mutmut does not run on
# Windows. The repo root's pytest settings apply, without its coverage options.
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-o", "addopts=--import-mode=importlib --strict-markers --strict-config"]
